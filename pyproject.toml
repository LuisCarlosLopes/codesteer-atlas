[project]
name = "codesteer-atlas"
version = "2.0.0"
description = "Servidor MCP local para busca semântica em bases de código usando LanceDB e Tree-sitter"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "CodeSteer Squad", email = "squad@codesteer.ai" }
]
dependencies = [
    "lancedb>=0.17.0,<0.34.0",
    "fastembed>=0.4",
    "tree-sitter>=0.22.0",
    # A API do chunker (parse(str), root_node(), node.kind()) vem do language-pack.
    # O teto evita que um ambiente resolvido fora do uv.lock (ex.: uvx --from git+...)
    # caia numa major com a API clássica baseada em bytes. Ver ASTChunker._verify_parser_api
    "tree-sitter-language-pack>=1.8.0,<2",
    "mcp>=1.24.0,<2",
    "fastmcp>=2.14.1,<4",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.5.2",
    "click>=8.1.0",
    "numpy>=1.24.0",
    "pathspec>=0.12.0",
    "filelock>=3.12.0",
]

[project.scripts]
indexer = "codesteer_atlas.indexer:cli"
server = "codesteer_atlas.server:main"
atlas-index = "codesteer_atlas.indexer:cli"
atlas-serve = "codesteer_atlas.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Conjunto de regras declarado explicitamente. Sem isto o projeto herda o default da
# versão de ruff instalada, e o CI roda `uv run --with ruff ruff check` (sem pin): o
# ruff 0.16 ampliou esse default (ligando I/UP/BLE/SIM/S) e passou a quebrar o build
# sem nenhuma mudança de código. Estes são os quatro prefixos que o projeto sempre usou.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
