[project]
name = "codesteer-atlas"
version = "3.0.0"
description = "Servidor MCP local para busca semântica em bases de código usando LanceDB e Tree-sitter"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "CodeSteer Squad", email = "squad@codesteer.ai" }
]
dependencies = [
    "lancedb>=0.17.0,<0.38.0",
    "fastembed>=0.4",
    "tree-sitter>=0.22.0",
    # 1.8–1.12: API nativa (parse(str)); ≥1.13: volta ao tree_sitter.Parser clássico
    # (parse(bytes)). O chunker normaliza as duas via _CompatParser — crítico para
    # `uvx --from git+...`, que ignora o uv.lock e resolve o último 1.x.
    "tree-sitter-language-pack>=1.8.0,<2",
    # uvx ignora o uv.lock; teto <2 impede mcp 2.x (McpError removido) com FastMCP 2.14.x.
    "mcp>=1.24.0,<2",
    "fastmcp>=2.14.1,<4",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.5.2",
    "click>=8.1.0",
    "numpy>=1.24.0",
    "pathspec>=0.12.0",
    "filelock>=3.12.0",
]

[project.optional-dependencies]
# Extra opcional do watcher (ATLAS_WATCH=1). Import preguiçoso: sem este extra o
# servidor sobe igual e reporta watch="unavailable". Teto <7 pela mesma política
# de pin dos demais tetos (ver `mcp>=1.24.0,<2`): uvx ignora o uv.lock e resolveria
# o último major, então a major seguinte entra só depois de validada.
watch = ["watchdog>=4.0,<7"]

[project.scripts]
indexer = "codesteer_atlas.indexer:cli"
server = "codesteer_atlas.server:main"
atlas-index = "codesteer_atlas.indexer:cli"
atlas-serve = "codesteer_atlas.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    # Usado só pelo harness de avaliação (scripts/eval_search.py) para ler o
    # golden set. Declarado explicitamente para não depender de resolução
    # transitiva via fastembed/huggingface-hub.
    "pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Conjunto de regras declarado explicitamente, para não herdar o default da versão de
# ruff instalada — foi o que quebrou o build no ruff 0.16 sem nenhuma mudança de código.
# A proteção contra isso é o pin da versão no CI (`ruff==0.16.1`), não o estreitamento
# do ruleset. `UP` e `E5` (line-too-long) ficam de fora deliberadamente: seriam ~340
# achados de modernização de tipagem/formatação, puro churn sobre o `git blame`.
select = ["E4", "E7", "E9", "F", "I", "B", "SIM"]

[tool.mypy]
# O plugin do Pydantic é o que ensina o mypy a entender campos com default nos modelos;
# sem ele, todo `CodeChunk(...)`/`IndexStats(...)` vira falso positivo de "Missing named argument".
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
